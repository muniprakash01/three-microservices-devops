services:

  user-service:
    build: ./user-service
    image: three-microservices-user:latest
    container_name: user-service
    ports:
      - "5001:5000"
    volumes:
      - user-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  product-service:
    build: ./product-service
    image: three-microservices-product:latest
    container_name: product-service
    ports:
      - "5002:5000"
    volumes:
      - product-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  order-service:
    build: ./order-service
    image: three-microservices-order:latest
    container_name: order-service
    ports:
      - "5003:5000"
    environment:
      USER_SERVICE_URL: http://user-service:5000
      PRODUCT_SERVICE_URL: http://product-service:5000
    volumes:
      - order-data:/data
    depends_on:
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  user-data:
  product-data:
  order-data:
