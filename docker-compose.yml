services:
  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "5001:5000"
    volumes:
      - user_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  product-service:
    build: ./product-service
    container_name: product-service
    ports:
      - "5002:5000"
    volumes:
      - product_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "5003:5000"
    depends_on:
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
    volumes:
      - order_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - user-service
      - product-service
      - order-service
    restart: unless-stopped

volumes:
  user_data:
  product_data:
  order_data:

networks:
  app-network:
    driver: bridge
